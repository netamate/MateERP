# CI validates backend, frontend, and the production container build boundary before deployment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mateerp
          POSTGRES_USER: mateerp
          POSTGRES_PASSWORD: mateerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mateerp -d mateerp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://mateerp:mateerp@127.0.0.1:5432/mateerp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
      - run: pytest
      - run: python manage.py spectacular --validate --file schema.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  production-images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            dockerfile: backend/Dockerfile.production
            tag: mateerp-backend-ci
          - context: frontend
            dockerfile: frontend/Dockerfile.production
            tag: mateerp-frontend-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.tag }}
