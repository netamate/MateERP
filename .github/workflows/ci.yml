# Phase 5 CI validates finance operations and the underlying accounting/security foundations.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mateerp
          POSTGRES_USER: mateerp
          POSTGRES_PASSWORD: mateerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mateerp -d mateerp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://mateerp:mateerp@127.0.0.1:5432/mateerp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format .
      - name: Commit deterministic Phase 5 formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/finance/api/serializers.py apps/finance/api/views.py apps/finance/services.py
            git commit -m "Format Phase 5 finance backend"
            git push origin HEAD:main
          fi
      - run: python manage.py makemigrations --check
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
      - run: pytest
      - run: python manage.py spectacular --validate --file schema.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
