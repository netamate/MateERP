# Phase 2 backend dependency and quality configuration.
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mateerp-backend"
version = "0.1.0"
description = "MateERP Django REST API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Django>=5.2.18,<5.3",
  "djangorestframework>=3.18,<3.19",
  "drf-spectacular>=0.30,<0.31",
  "django-filter>=26.1,<27",
  "dj-database-url>=3.0,<4",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.13,<0.14",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
